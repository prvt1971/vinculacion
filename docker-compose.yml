services:
  web:
    build: .
    container_name: php-app
    image: php:frontend
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      APACHE_DOCUMENT_ROOT: "/var/www/html"
      DB_HOST: mariadb
      DB_PASSWORD: password
      DB_USER: user
  webserver:
    image: nginx:1.25-alpine
    container_name: nginx-server
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infra-configs/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
  db:
    image: mariadb:10.4
    container_name: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: titulacion
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
      # Uncomment the next line to auto-import your SQL on first run
      # - ./Database/titulacion.sql:/docker-entrypoint-initdb.d/titulacion.sql:ro
volumes:
  db_data:
